spring.application.name=bff-atm
server.port=8083

# Detección dinámica con Eureka
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-server:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Configuración de Resilience4j (Circuit Breaker)
resilience4j.circuitbreaker.instances.backend-cb.slidingWindowSize=5
resilience4j.circuitbreaker.instances.backend-cb.failureRateThreshold=50
resilience4j.circuitbreaker.instances.backend-cb.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.backend-cb.permittedNumberOfCallsInHalfOpenState=3

# Seguridad HTTPS
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth-server:9000