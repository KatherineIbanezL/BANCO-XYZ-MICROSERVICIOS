spring.application.name=bff-atm
server.port=8083

# URL del Backend Core al que consultará este BFF
banco-core.base-url=${CORE_BANCO_BASE_URL:http://banco-core:8080}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-server:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Habilitar HTTPS con el keystore
#server.ssl.enabled=true
#server.ssl.key-store=classpath:keystore.p12
#server.ssl.key-store-password=changeit
#server.ssl.key-store-type=PKCS12
#server.ssl.key-alias=tomcat

# ==========================================
# Configuración de Resilience4j (Circuit Breaker)
# ==========================================
resilience4j.circuitbreaker.instances.bancoCoreService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.bancoCoreService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.bancoCoreService.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.bancoCoreService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.bancoCoreService.automaticTransitionFromOpenToHalfOpenEnabled=true

# Configuración de Reintentos (Retry)
resilience4j.retry.instances.bancoCoreService.maxAttempts=3
resilience4j.retry.instances.bancoCoreService.waitDuration=1s

# Configuración de Spring Kafka
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:kafka:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*


spring.security.oauth2.resourceserver.jwt.issuer-uri=http://auth-server:9000