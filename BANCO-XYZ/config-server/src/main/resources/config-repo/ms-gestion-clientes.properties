# Nombre del microservicio
spring.application.name=ms-gestion-clientes
server.port=8084

# Conexión a la Base de Datos 
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.datasource.url=jdbc:mysql://mysql-db:3306/banco_xyz?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.datasource.hikari.data-source-properties.useSSL=false
spring.datasource.hikari.data-source-properties.allowPublicKeyRetrieval=true

# Configuración de Spring Batch
spring.batch.jdbc.initialize-schema=always
spring.sql.init.platform=mysql
spring.batch.job.enabled=false

# Configuración del Cliente Eureka para el Service Discovery
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-server:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Ruta base donde Docker monta el volumen de los archivos Batch
batch.data.base-path=/data