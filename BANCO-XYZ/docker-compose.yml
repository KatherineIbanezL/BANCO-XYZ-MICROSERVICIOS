services:
  auth-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - MODULE_NAME=auth-server
    container_name: auth-server
    ports:
      - "9000:9000"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --no-verbose --tries=1 --spider https://localhost:9000/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - banco-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - banco-network

  config-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - MODULE_NAME=config-server
    container_name: config-server
    ports:
      - "8888:8888"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8888/bff-mobile/default || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - banco-network

  discovery-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - MODULE_NAME=discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - banco-network

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: desaPOO#2
      MYSQL_DATABASE: banco_xyz
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdesaPOO#2"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - banco-network

  ms-gestion-clientes:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - MODULE_NAME=ms-gestion-clientes
    container_name: ms-gestion-clientes
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/banco_xyz?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=desaPOO#2
      - JAVA_TOOL_OPTIONS=-Djavax.net.ssl.trustStore=/keystore.p12 -Djavax.net.ssl.trustStorePassword=password123 -Djavax.net.ssl.trustStoreType=PKCS12
      - BATCH_DATA_BASE_PATH=/data
    volumes:
      - ./auth-server/src/main/resources/keystore.p12:/keystore.p12
      - ./data:/data
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql-db:
        condition: service_healthy
    networks:
      - banco-network

  ms-gestion-cuentas:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - MODULE_NAME=ms-gestion-cuentas
    container_name: ms-gestion-cuentas
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/banco_xyz?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=desaPOO#2
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JAVA_TOOL_OPTIONS=-Djavax.net.ssl.trustStore=/keystore.p12 -Djavax.net.ssl.trustStorePassword=password123 -Djavax.net.ssl.trustStoreType=PKCS12
      - BATCH_DATA_BASE_PATH=/data
    volumes:
      - ./auth-server/src/main/resources/keystore.p12:/keystore.p12
      - ./data:/data
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - banco-network

  ms-procesamiento-pagos:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - MODULE_NAME=ms-procesamiento-pagos
    container_name: ms-procesamiento-pagos
    ports:
      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/banco_xyz?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=desaPOO#2
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JAVA_TOOL_OPTIONS=-Djavax.net.ssl.trustStore=/keystore.p12 -Djavax.net.ssl.trustStorePassword=password123 -Djavax.net.ssl.trustStoreType=PKCS12
      - BATCH_DATA_BASE_PATH=/data
    volumes:
      - ./auth-server/src/main/resources/keystore.p12:/keystore.p12
      - ./data:/data
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - banco-network

  bff-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - MODULE_NAME=bff-web
    container_name: bff-web
    ports:
      - "8081:8081"
    restart: on-failure
    environment:
      - JAVA_TOOL_OPTIONS=-Djavax.net.ssl.trustStore=/keystore.p12 -Djavax.net.ssl.trustStorePassword=password123 -Djavax.net.ssl.trustStoreType=PKCS12
    volumes:
      - ./auth-server/src/main/resources/keystore.p12:/keystore.p12
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-server:
        condition: service_started
      ms-gestion-clientes:
        condition: service_started
      ms-gestion-cuentas:
        condition: service_started
    networks:
      - banco-network

  bff-mobile:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - MODULE_NAME=bff-mobile
    container_name: bff-mobile
    ports:
      - "8082:8082"
    restart: on-failure
    environment:
      - JAVA_TOOL_OPTIONS=-Djavax.net.ssl.trustStore=/keystore.p12 -Djavax.net.ssl.trustStorePassword=password123 -Djavax.net.ssl.trustStoreType=PKCS12
    volumes:
      - ./auth-server/src/main/resources/keystore.p12:/keystore.p12
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-server:
        condition: service_started
      ms-gestion-cuentas:
        condition: service_started
    networks:
      - banco-network

  bff-atm:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - MODULE_NAME=bff-atm
    container_name: bff-atm
    ports:
      - "8083:8083"
    restart: on-failure
    environment:
      - JAVA_TOOL_OPTIONS=-Djavax.net.ssl.trustStore=/keystore.p12 -Djavax.net.ssl.trustStorePassword=password123 -Djavax.net.ssl.trustStoreType=PKCS12
    volumes:
      - ./auth-server/src/main/resources/keystore.p12:/keystore.p12
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      auth-server:
        condition: service_started
      ms-procesamiento-pagos:
        condition: service_started
    networks:
      - banco-network

networks:
  banco-network:
    driver: bridge