spring.application.name=banco-core
server.port=8080

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Conexión a la Base de Datos
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/banco_xyz?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
# Forzar propiedades de conexión de MySQL 8
spring.datasource.hikari.data-source-properties.useSSL=false
spring.datasource.hikari.data-source-properties.allowPublicKeyRetrieval=true

# Configuración de Spring Batch
spring.batch.jdbc.initialize-schema=always
spring.sql.init.platform=mysql

spring.batch.job.enabled=false