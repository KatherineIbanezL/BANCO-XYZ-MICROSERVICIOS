server.port=8761
spring.application.name=discovery-server
spring.config.import=optional:configserver:http://config-server:8888

# Configuración del cliente Eureka (desactivado para el servidor)
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Desactiva la autopreservación para que los servicios apagados desaparezcan rápido del panel
eureka.server.enable-self-preservation=false

# Exposición de endpoints de Actuator para salud e información
management.endpoints.web.exposure.include=health,info